server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5500" # URL de tu frontend
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
            allowedHeaders: "*"
      routes:
        - id: servicio-usuarios
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/usuarios/**

        - id: servicio-productos
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/productos/**