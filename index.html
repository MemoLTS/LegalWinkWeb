<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LegalWink</title>
    <!-- Carga de Bootstrap y Bootstrap Icons desde CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>
<body class="home-page">
    <header class="top-menu">
        <a class="brand" href="index.html">LegalWink</a>
        <nav aria-label="Menú principal">
            <a class="top-menu-link active" href="index.html">Inicio</a>
            <a class="top-menu-link" href="video.html">
                <i class="bi bi-play-circle" aria-hidden="true"></i>
                Video
            </a>
        </nav>
    </header>

    <main class="catalogo">
        <section class="catalogo-intro">
            <p class="eyebrow">Próximamente</p>
            <h1>Catálogo LegalWink</h1>
            <p>Explora los contenidos que estamos preparando.</p>
        </section>

        <section class="catalogo-grid" id="catalogo-grid" aria-label="Catálogo de contenidos"></section>

        <nav class="paginacion-catalogo" aria-label="Páginas del catálogo">
            <button class="pagina-boton activo" type="button" data-pagina="1" aria-label="Página 1" aria-current="page">1</button>
            <button class="pagina-boton" type="button" data-pagina="2" aria-label="Página 2">2</button>
            <button class="pagina-boton" type="button" data-pagina="3" aria-label="Página 3">3</button>
            <button class="pagina-boton" type="button" data-pagina="4" aria-label="Página 4">4</button>
        </nav>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/catalogo.js"></script>
</body>

</html>
