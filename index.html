<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LegalWink</title>
    <!--BootStrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="video-container" id="player-container">

        <!-- Overlay de estado / carga -->
        <div id="status" class="status">Listo para conectar</div>

        <!-- Canvas donde se pinta el video convertido a ASCII en tiempo real -->
        <canvas id="ascii-canvas"></canvas>

        <!-- Capa de texto invisible: permite seleccionar/copiar el ASCII con el mouse -->
        <pre id="ascii-selection"></pre>

        <!-- Overlay de "click para iniciar" (los navegadores exigen interacción para reproducir audio) -->
        <div id="play-overlay" class="play-overlay">
            <div class="play-btn"></div>
            <span>Iniciar transmisión ASCII</span>
        </div>

        <!-- Barra de controles personalizada (mismo estilo que el reproductor original) -->
        <div class="controls">
            <input type="range" id="progress-bar" value="0" min="0" max="100" step="0.1">

            <div class="bottom-controls">
                <div class="left-controls">
                    <button id="play-pause-btn">▶</button>
                    <span id="time-display">00:00 / 00:00</span>
                    <input type="range" id="volume-bar" value="1" min="0" max="1" step="0.05">
                </div>

                <div class="right-controls">
                    <button id="fullscreen-btn">⛶</button>
                </div>
            </div>
        </div>

        <!-- Elemento de audio oculto: el SDK lo usa como reloj maestro de sincronía -->
        <audio id="ascii-audio" preload="none"></audio>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
