<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="loading-screen" class="loading-screen" role="status" aria-live="polite">
        <h1 id="cargando">Cargando</h1>
        <div class="loading-spinner" aria-hidden="true"></div>
    </div>
    <main class="video-page">
        <div class="video-header">
            <a class="back-link" href="index.html">
                <i class="bi bi-arrow-left" aria-hidden="true"></i>
                Volver al catálogo
            </a>
            <button class="theme-toggle" type="button" aria-label="Activar modo claro" title="Activar modo claro">
                <i class="bi bi-sun" aria-hidden="true"></i>
            </button>
        </div>

        <div class="video-container is-loading" id="player-container">
            <div class="status" id="status">Preparando video...</div>
            <pre class="ascii-player"></pre>
            <canvas class="ascii-canvas"></canvas>
            <audio class="ascii-audio" preload="none"></audio>
        </div>

        <div class="video-info">
            <h1 id="video-title">Contenido</h1>
            <button class="fullscreen-button" id="fullscreen-btn" type="button">
                <i class="bi bi-fullscreen" aria-hidden="true"></i>
                Pantalla completa
            </button>
        </div>

        <nav class="video-navigation" aria-label="Navegación entre contenidos">
            <button id="previous-video" type="button">
                <i class="bi bi-arrow-left" aria-hidden="true"></i>
                Anterior
            </button>
            <span id="video-position"></span>
            <button id="next-video" type="button">
                Siguiente
                <i class="bi bi-arrow-right" aria-hidden="true"></i>
            </button>
        </nav>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script src="js/asciline/codec.js"></script>
    <script src="js/asciline/reader.js"></script>
    <script src="js/carga.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/video.js"></script>
</body>
</html>
